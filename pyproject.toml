[project]
name = "booth-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "YC815", email = "yushun@chen.zone" }
]
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
